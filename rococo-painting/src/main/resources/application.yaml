server:
  port: 8088

grpc:
  server:
    port: 9091
#    server:
#      max-inbound-message-size: 10485760 # 10 MB
#    client:
#      grpcUserdataClient:
#        max-inbound-message-size: 10485760
#        max-outbound-message-size: 10485760

spring:
  grpc:
    server:
      servlet:
        enabled: false
  application:
    name: rococo-painting
  mvc:
    log-request-details: true
  datasource:
    url: 'jdbc:mysql://127.0.0.1:3306/rococo-painting?serverTimezone=UTC&createDatabaseIfNotExist=true'
    hikari:
      connection-timeout: 20000
      minimum-idle: 10
      maximum-pool-size: 30
      idle-timeout: 10000
      max-lifetime: 1000
      auto-commit: true
    username: root
    password: secret
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    schemas: rococo-painting
    locations: classpath:db/migration/rococo-painting
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
    database-platform: org.hibernate.dialect.MySQL8Dialect
    show-sql: false
    generate-ddl: true
    open-in-view: false



logging:
  file:
    path: ./logs/rococo-painting
  level:
    root: INFO
    io.grpc.netty.NettyServerHandler: ERROR
    io.netty.handler.codec.http2.Http2ConnectionHandler: ERROR
    i.grpc.netty.NettyServerTransport: ERROR
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: DEBUG
    org.springframework.boot.autoconfigure: DEBUG



---
spring:
  config:
    activate:
      on-profile: 'local'
  autoconfigure:
    exclude:
      - 'org.springframework.cloud.vault.config.VaultAutoConfiguration'
      - 'org.springframework.cloud.vault.config.VaultObservationAutoConfiguration'
      - 'org.springframework.cloud.vault.config.VaultReactiveAutoConfiguration'
  datasource:
    url: 'jdbc:mysql://localhost:3306/rococo-painting'
    username: root
    password: secret
rococo-painting:
  base-uri: 'http://127.0.0.1:8088'

---
spring:
  config:
    activate:
      on-profile: 'docker'
  autoconfigure:
    exclude:
      - 'org.springframework.cloud.vault.config.VaultAutoConfiguration'
      - 'org.springframework.cloud.vault.config.VaultObservationAutoConfiguration'
      - 'org.springframework.cloud.vault.config.VaultReactiveAutoConfiguration'
  datasource:
    url: 'jdbc:mysql://rococo-all-db:3306/rococo-painting'
    username: root
    password: secret


