name: e2e

on:
  pull_request:
    types: [ opened, reopened, synchronize ]

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    env:
      PROFILE: docker
      PREFIX: yegorych
      ARCH: amd64
      FRONT: rococo-client
      COMPOSE_PROFILES: test
      ALLURE_DOCKER_API: ${{ secrets.ALLURE_DOCKER_API }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      EXECUTION_TYPE: github
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.GITHUB_SHA }}
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Build backends
        run: |
          ./gradlew jibDockerBuild -x :rococo-e-2-e-tests:test
      - name: Pull browsers
        run: |
          docker pull selenoid/vnc_chrome:127.0
      - name: Get the last commit message
        run: |
          echo "HEAD_COMMIT_MESSAGE=$(git show -s --format=%s)" >> $GITHUB_ENV
      - name: Run e2e-tests
        id: e2e
        run: |
          : # run e2e tests
          docker compose up -d
          docker ps -a
          docker wait rococo-e-2-e
          exit_code=$(docker inspect -f '{{.State.ExitCode}}' rococo-e-2-e)
          echo "E2E_EXIT_CODE=$exit_code" >> $GITHUB_OUTPUT
          echo "### Test logs ###"
          docker logs rococo-e-2-e
#          if docker logs rococo-e-2-e | grep -q "BUILD SUCCESSFUL"; then
          if [ "$(docker logs rococo-e-2-e | tail -n 10 | grep -c '^BUILD SUCCESSFUL')" -gt 0 ]; then
            echo "E2E_EXIT_CODE=0" >> $GITHUB_OUTPUT
            echo "Tests passed successfully!"
            exit 0
          else
            echo "E2E_EXIT_CODE=1" >> $GITHUB_OUTPUT
            echo "Tests failed!"
            exit 1
          fi
#          if [ "$exit_code" -eq "0" ]; then
#            echo "Tests passed successfully!"
#            exit 0
#          else
#            echo "Tests failed!"
#            exit 1
#          fi
      - name: Add comment to PR with link to allure
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const exitCode = ${{ steps.e2e.outputs.E2E_EXIT_CODE }}
            const reportUrl = 'https://allure.niffler-stage.qa.guru/api/allure-docker-service/projects/rococo-yegorych/reports/latest/index.html'
            const historyUrl = 'https://allure.niffler-stage.qa.guru/allure-docker-service-ui/projects/rococo-yegorych'
            const message = exitCode == '0' ?
              `✅ TEST RUN PASSED ✅ There is the [report](${reportUrl})\n🕓 All reports [history](${historyUrl})` :
              `🔴 TEST RUN FAILED 🔴 There is the [report](${reportUrl})\n🕓 All reports [history](${historyUrl})`
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            })
