syntax = "proto3";

package guru.qa.grpc.rococo.userdata;

option java_multiple_files = true;
option java_package = "guru.qa.grpc.rococo.userdata";
option java_outer_classname = "RococoUserdataProto";

service RococoUserdataService {
  rpc GetUser (UserRequest) returns (UserInfo) {}
  rpc UpdateUser (UserInfo) returns (UserInfo) {}
}

message UserRequest {
  string username = 1;
}

message UserInfo {
  string id = 1;
  string username = 2;
  string firstname = 3;
  string lastname = 4;
  bytes avatar = 5;
}

